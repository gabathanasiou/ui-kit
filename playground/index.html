<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ui-kit playground</title>
    <style>
      body { font-family: Helvetica, Arial, sans-serif; margin: 0; background: #f4f4f5; color: #18181b; }
      section { border: 1px dashed #a1a1aa; border-radius: 12px; padding: 16px; margin: 16px; background: #fff; }
      h2 { margin-top: 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: #52525b; }
      .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
      .label { font-size: 11px; color: #a1a1aa; width: 100%; }
      body.dark { background: #18181b; color: #fafafa; }
      body.dark section { background: #27272a; border-color: #3f3f46; }
      body.dark h2 { color: #a1a1aa; }
    </style>
  </head>

    <div id="root"></div>
